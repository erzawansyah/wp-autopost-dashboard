# ==============================================================================
# SEARXNG CONFIGURATION FOR WP-AUTOPOST-DASHBOARD
# ==============================================================================
# Dokumentasi: https://docs.searxng.org/admin/settings/index.html

use_default_settings: true

general:
  debug: false
  instance_name: "Panitera SearXNG Engine"

server:
  # Nilai sebenarnya WAJIB diberikan lewat env SEARXNG_SECRET (docker-compose menolak start tanpa nilai ini).
  # "ultrasecretkey" adalah sentinel bawaan SearXNG yang membuat instance menolak berjalan tanpa override.
  secret_key: "ultrasecretkey"
  bind_address: "0.0.0.0"
  port: 8080
  # Matikan limiter lokal untuk request dari aplikasi web-search dashboard internal
  limiter: false
  # Dimatikan: endpoint /image_proxy bisa dipakai sebagai proxy SSRF ke jaringan internal.
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # Wajib mengaktifkan format json agar REST API /search?format=json dari dashboard berfungsi
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false

  - name: bing images
    engine: bing_images
    shortcut: bi
    disabled: false

  - name: google images
    engine: google_images
    shortcut: gi
    disabled: false

  - name: duckduckgo images
    engine: duckduckgo_images
    shortcut: ddi
    disabled: false

  - name: unsplash
    engine: unsplash
    shortcut: un
    disabled: false
