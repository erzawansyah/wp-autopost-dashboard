name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_dispatch:

# Run lama pada ref yang sama dibatalkan saat ada commit baru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Placeholder publik untuk build — BUKAN secret. Nilai NEXT_PUBLIC_* di-bake ke bundle client.
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy

jobs:
  checks:
    name: Typecheck, lint, test & audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test (Vitest, termasuk test DB PGlite di supabase/tests)
        run: npm test

      - name: Audit kebersihan codebase
        run: npm run audit:hygiene

      # Level "critical": saat ini ada 4 advisory high transitif yang belum bisa diperbaiki
      # (deepagents → fast-glob/micromatch → braces; "fix" npm hanya berupa downgrade
      # deepagents ke 0.0.2). Naikkan ke "high" begitu upstream merilis perbaikan.
      - name: Audit kerentanan dependensi produksi
        run: npm audit --omit=dev --audit-level=critical

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  docker:
    name: Docker image build (tanpa push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: panitera:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
