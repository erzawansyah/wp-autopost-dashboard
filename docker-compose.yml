services:
  wp-autopost-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
    container_name: wp-autopost-dashboard
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      - searxng-internal
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

      # 1. Supabase (Database & Auth)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}
      - SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF:-}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN:-}

      # 2. Security & Encryption (AES-256-GCM Master Key)
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - CRON_SECRET=${CRON_SECRET:-}
      - WEBHOOK_SIGNATURE_SECRET=${WEBHOOK_SIGNATURE_SECRET:-}

      # 3. AI Providers
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-anthropic/claude-3.5-sonnet}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:3000}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-WP Autopost Dashboard}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

      # 4. SEO & Integrations
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN:-}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD:-}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}

      # 5. Self-Hosted Metasearch (SearXNG)
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng-internal:8080}

    # Optional: pasang env_file jika di Portainer menggunakan file .env
    # env_file:
    #   - .env

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  searxng-internal:
    container_name: searxng-internal
    image: searxng/searxng:latest
    restart: unless-stopped
    # Hanya di-expose ke internal docker network (tidak membuka port ke internet/host luar)
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng-internal:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-wp-autopost-dashboard-searxng-internal-key-change-if-public}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  queue-cron:
    container_name: wp-autopost-cron
    image: alpine:latest
    restart: unless-stopped
    depends_on:
      wp-autopost-dashboard:
        condition: service_healthy
    volumes:
      - cron-logs:/var/log/cron
    environment:
      - CRON_SECRET=${CRON_SECRET:-}
      - CRON_LIMIT=${QUEUE_CRON_LIMIT:-5}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata
        mkdir -p /var/log/cron
        echo "[Queue Cron] Service pemicu antrean aktif (Target: http://wp-autopost-dashboard:3000/api/queue/process?limit=$${CRON_LIMIT})."
        while true; do
          if [ -n "$$CRON_SECRET" ]; then
            RESPONSE=$$(curl -s -X POST "http://wp-autopost-dashboard:3000/api/queue/process?limit=$${CRON_LIMIT}" \
              -H "Authorization: Bearer $$CRON_SECRET" \
              -H "Accept: text/plain" \
              -H "Content-Type: application/json")
          else
            RESPONSE=$$(curl -s -X POST "http://wp-autopost-dashboard:3000/api/queue/process?limit=$${CRON_LIMIT}" \
              -H "Accept: text/plain" \
              -H "Content-Type: application/json")
          fi

          if [ -n "$$RESPONSE" ]; then
            printf "%s\n" "$$RESPONSE" | tee -a /var/log/cron/queue.log
          fi

          sleep 60
        done

volumes:
  cron-logs:
    name: wp_autopost_cron_logs


