services:
  panitera:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
    container_name: panitera
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      - searxng-internal
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

      # 1. Supabase (Database & Multi-Tenant Auth)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}

      # 2. Keamanan & Kriptografi (Wajib untuk Enkripsi Kunci User & Password WP)
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      # CRON_SECRET opsional dengan runner tertanam; WAJIB bila QUEUE_RUNNER=off (antrean digerakkan
      # cron eksternal ke /api/queue/process). Tanpa nilai ini semua pemicu cron ditolak (401).
      - CRON_SECRET=${CRON_SECRET:-}

      # 2b. Runner antrean tertanam: loop klaim + lease + heartbeat di proses ini (tanpa sidecar cron).
      #     `off` hanya untuk mode pemicu cron eksternal / serverless.
      - QUEUE_RUNNER=${QUEUE_RUNNER:-embedded}
      # Tuning opsional (kosong = default aplikasi):
      # - QUEUE_CONCURRENCY=${QUEUE_CONCURRENCY:-3}               # job paralel per proses (1–10)
      # - QUEUE_POLL_INTERVAL_MS=${QUEUE_POLL_INTERVAL_MS:-5000}  # jeda polling saat idle (>= 1000)
      # - QUEUE_LEASE_SECONDS=${QUEUE_LEASE_SECONDS:-900}         # lease item in-flight (60–3600)

      # 3. Pengaturan Platform & SearXNG Internal
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-Panitera}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:3000}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng-internal:8080}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}

      # 4. Kunci platform (opsional; default BYOK-only) & default model
      - PLATFORM_KEY_ALLOWED=${PLATFORM_KEY_ALLOWED:-false}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PEXAFY_API_KEY=${PEXAFY_API_KEY:-}
      - OPENROUTER_DEFAULT_MODEL=${OPENROUTER_DEFAULT_MODEL:-}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-}

      # 5. Kill switch tracing LangSmith global operator (opsional)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-}

    # Optional: pasang env_file jika di Portainer menggunakan file .env
    # env_file:
    #   - .env

    # Graceful shutdown runner antrean: saat SIGTERM runner berhenti mengklaim, menunggu job berjalan
    # hingga 25 detik, lalu melepas lease item yang belum selesai sebelum Next.js menutup server.
    stop_grace_period: 40s

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  searxng-internal:
    container_name: searxng-internal
    # Tag dipin agar deploy reprodusibel; perbarui berkala (Dependabot docker-compose, bulanan).
    image: searxng/searxng:2026.10.13-22c64b8d3
    restart: unless-stopped
    # Hanya di-expose ke internal docker network (tidak membuka port ke internet/host luar)
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng-internal:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET wajib diisi (string acak panjang, mis. hasil openssl rand -hex 32)}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
