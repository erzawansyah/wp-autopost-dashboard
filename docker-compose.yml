services:
  panitera:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
    container_name: panitera
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    depends_on:
      - searxng-internal
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

      # 1. Supabase (Database & Multi-Tenant Auth)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}

      # 2. Keamanan & Kriptografi (Wajib untuk Enkripsi Kunci User & Password WP)
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      # CRON_SECRET wajib: tanpa nilai ini semua pemicu cron ke /api/queue/process ditolak (401).
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET wajib diisi (string acak panjang, mis. hasil openssl rand -hex 32)}

      # 3. Pengaturan Platform & SearXNG Internal
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-Panitera}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:3000}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng-internal:8080}

    # Optional: pasang env_file jika di Portainer menggunakan file .env
    # env_file:
    #   - .env

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  searxng-internal:
    container_name: searxng-internal
    image: searxng/searxng:latest
    restart: unless-stopped
    # Hanya di-expose ke internal docker network (tidak membuka port ke internet/host luar)
    expose:
      - "8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng-internal:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET wajib diisi (string acak panjang, mis. hasil openssl rand -hex 32)}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  queue-cron:
    container_name: panitera-cron
    image: alpine:3.24
    restart: unless-stopped
    depends_on:
      panitera:
        condition: service_healthy
    volumes:
      - cron-logs:/var/log/cron
    environment:
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET wajib diisi (string acak panjang, mis. hasil openssl rand -hex 32)}
      - CRON_LIMIT=${QUEUE_CRON_LIMIT:-5}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl tzdata
        mkdir -p /var/log/cron
        echo "[Queue Cron] Service pemicu antrean aktif (Target: http://panitera:3000/api/queue/process?limit=$${CRON_LIMIT})."
        while true; do
          # Token hanya lewat header (query ?secret= tidak didukung). --max-time mencegah loop macet
          # bila worker lama merespons (generasi Agent Profile mode deep bisa beberapa menit).
          RESPONSE=$$(curl -sS --connect-timeout 10 --max-time 900 -X POST "http://panitera:3000/api/queue/process?limit=$${CRON_LIMIT}" \
            -H "Authorization: Bearer $$CRON_SECRET" \
            -H "Accept: text/plain" \
            -H "Content-Type: application/json")

          if [ -n "$$RESPONSE" ]; then
            printf "%s\n" "$$RESPONSE" | tee -a /var/log/cron/queue.log
          fi

          sleep 60
        done

volumes:
  cron-logs:
    name: panitera_cron_logs


